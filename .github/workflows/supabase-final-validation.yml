name: Supabase final validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: supabase start
      - name: Reset local database
        run: supabase db reset --local
      - name: Run pgTAP database tests
        run: supabase test db --local
      - name: Validate generated schema types parity
        run: npm run test:integration:parity

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:run
      - name: Coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Full quality check
        run: npm run check
      - name: Validate whitespace
        run: git diff --check

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
