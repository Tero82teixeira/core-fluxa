name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run check
      - run: npm run test:coverage
  integration-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from every migration
        run: supabase db reset --local
      - name: Run pgTAP integration tests
        run: supabase test db --local
      - name: Check frontend/schema parity
        run: npm run test:integration:parity
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
